<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arisan Mingguan</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#20242b}
.container{max-width:900px;margin:auto;padding:20px}
header{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 15px #0000000d}
h1{margin:0 0 6px;font-size:26px}.muted{color:#707782;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 3px 15px #0000000d}.label{font-size:12px;color:#777}.value{font-size:21px;font-weight:700;margin-top:6px}
.panel{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 15px #0000000d}
h2{font-size:18px;margin:0 0 14px}
form{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px}
input,select,button{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:14px}
button{background:#20242b;color:white;border:0;cursor:pointer;font-weight:600}
button.secondary{background:#eef0f4;color:#20242b}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;font-size:14px}
th{color:#777;font-size:12px}.status{font-weight:700}.ok{color:#18864b}.no{color:#d34a4a}
.actions button{width:auto;padding:7px 10px;margin-right:4px;font-size:12px}
.empty{text-align:center;color:#888;padding:20px}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}table{font-size:12px}th,td{padding:9px 5px}.container{padding:12px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Arisan Mingguan</h1>
<div class="muted">Monitoring setoran arisan sederhana</div>
</header>

<div class="cards">
<div class="card"><div class="label">Total Anggota</div><div class="value" id="totalAnggota">0</div></div>
<div class="card"><div class="label">Sudah Setor</div><div class="value" id="sudahSetor">0</div></div>
<div class="card"><div class="label">Belum Setor</div><div class="value" id="belumSetor">0</div></div>
<div class="card"><div class="label">Total Terkumpul</div><div class="value" id="totalUang">Rp0</div></div>
</div>

<div class="panel">
<h2>Tambah Anggota</h2>
<form id="anggotaForm">
<input id="namaAnggota" class="wide" placeholder="Nama anggota" required>
<button type="submit">Tambah</button>
</form>
</div>

<div class="panel">
<h2>Input Setoran</h2>
<form id="setoranForm">
<select id="namaSetoran" required><option value="">Pilih nama</option></select>
<input id="tanggal" type="date" required>
<input id="jumlah" type="number" min="0" placeholder="Jumlah (Rp)" required>
<button type="submit">Simpan</button>
</form>
</div>

<div class="panel">
<h2>Monitoring Minggu Ini</h2>
<table>
<thead><tr><th>No</th><th>Nama</th><th>Tanggal Setor</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead>
<tbody id="monitoring"></tbody>
</table>
</div>

<div class="panel">
<h2>Riwayat Setoran</h2>
<table>
<thead><tr><th>Nama</th><th>Tanggal</th><th>Jumlah</th><th>Aksi</th></tr></thead>
<tbody id="riwayat"></tbody>
</table>
</div>
</div>

<script>
const KEY='arisanDataV1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"anggota":[],"setoran":[]}');

const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function today(){return new Date().toISOString().slice(0,10)}

document.getElementById('anggotaForm').onsubmit=e=>{
 e.preventDefault();
 const nama=document.getElementById('namaAnggota').value.trim();
 if(nama && !data.anggota.includes(nama)){data.anggota.push(nama);document.getElementById('namaAnggota').value='';save();}
};

document.getElementById('setoranForm').onsubmit=e=>{
 e.preventDefault();
 const nama=document.getElementById('namaSetoran').value;
 const tanggal=document.getElementById('tanggal').value;
 const jumlah=Number(document.getElementById('jumlah').value);
 if(nama&&tanggal&&jumlah>=0){data.setoran.push({id:Date.now(),nama,tanggal,jumlah});document.getElementById('jumlah').value='';save();}
};

function render(){
 const names=document.getElementById('namaSetoran');
 names.innerHTML='<option value="">Pilih nama</option>'+data.anggota.map(n=>`<option>${esc(n)}</option>`).join('');
 const todayDate=today();
 const weekly=data.setoran.filter(x=>x.tanggal===todayDate);
 const paidNames=new Set(weekly.map(x=>x.nama));
 document.getElementById('totalAnggota').textContent=data.anggota.length;
 document.getElementById('sudahSetor').textContent=paidNames.size;
 document.getElementById('belumSetor').textContent=Math.max(0,data.anggota.length-paidNames.size);
 document.getElementById('totalUang').textContent=rupiah(data.setoran.reduce((a,x)=>a+x.jumlah,0));

 document.getElementById('monitoring').innerHTML=data.anggota.length?data.anggota.map((n,i)=>{
   const s=[...weekly].reverse().find(x=>x.nama===n);
   return `<tr><td>${i+1}</td><td>${esc(n)}</td><td>${s?s.tanggal:'—'}</td><td>${s?rupiah(s.jumlah):'—'}</td><td class="status ${s?'ok':'no'}">${s?'Sudah setor':'Belum setor'}</td><td class="actions">${s?`<button class="secondary" onclick="hapus(${s.id})">Hapus</button>`:''}</td></tr>`
 }).join(''):'<tr><td colspan="6" class="empty">Belum ada anggota.</td></tr>';

 document.getElementById('riwayat').innerHTML=data.setoran.length?[...data.setoran].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).map(x=>`<tr><td>${esc(x.nama)}</td><td>${x.tanggal}</td><td>${rupiah(x.jumlah)}</td><td class="actions"><button class="secondary" onclick="hapus(${x.id})">Hapus</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada setoran.</td></tr>';
 document.getElementById('tanggal').value ||= todayDate;
}
function hapus(id){if(confirm('Hapus data setoran ini?')){data.setoran=data.setoran.filter(x=>x.id!==id);save();}}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
render();
</script>
</body>
</html>
