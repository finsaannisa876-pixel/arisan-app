<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arisan Mingguan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#20242b}
.container{max-width:900px;margin:auto;padding:20px}
header{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 15px #0000000d}
h1{margin:0 0 6px;font-size:26px}.muted{color:#707782;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 3px 15px #0000000d}.label{font-size:12px;color:#777}.value{font-size:21px;font-weight:700;margin-top:6px}
.panel{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 15px #0000000d}
h2{font-size:18px;margin:0 0 14px}
form{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px}
input,select,button{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:14px}
button{background:#20242b;color:white;border:0;cursor:pointer;font-weight:600}
button.secondary{background:#eef0f4;color:#20242b}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;font-size:14px}
th{color:#777;font-size:12px}.status{font-weight:700}.ok{color:#18864b}.no{color:#d34a4a}
.actions button{width:auto;padding:7px 10px;margin-right:4px;font-size:12px}
.empty{text-align:center;color:#888;padding:20px}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}table{font-size:12px}th,td{padding:9px 5px}.container{padding:12px}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Arisan Mingguan</h1>
    <div class="muted">Monitoring setoran arisan real-time</div>
  </header>

  <div class="cards">
    <div class="card"><div class="label">Total Anggota</div><div class="value" id="totalAnggota">0</div></div>
    <div class="card"><div class="label">Sudah Setor</div><div class="value" id="sudahSetor">0</div></div>
    <div class="card"><div class="label">Belum Setor</div><div class="value" id="belumSetor">0</div></div>
    <div class="card"><div class="label">Total Terkumpul</div><div class="value" id="totalUang">Rp0</div></div>
  </div>

  <div class="panel">
    <h2>Tambah Anggota</h2>
    <form id="anggotaForm">
      <input id="namaAnggota" class="wide" placeholder="Nama anggota baru" required>
      <button type="submit">Tambah</button>
    </form>
  </div>

  <div class="panel">
    <h2>Input Setoran</h2>
    <form id="setoranForm">
      <select id="namaSetoran" required><option value="">Pilih nama</option></select>
      <input id="tanggal" type="date" required>
      <input id="jumlah" type="number" min="0" placeholder="Jumlah (Rp)" required>
      <button type="submit">Simpan</button>
    </form>
  </div>

  <div class="panel">
    <h2>Monitoring Hari Ini</h2>
    <table>
      <thead><tr><th>No</th><th>Nama</th><th>Tanggal Setor</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody id="monitoring"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Riwayat Setoran</h2>
    <table>
      <thead><tr><th>Nama</th><th>Tanggal</th><th>Jumlah</th><th>Aksi</th></tr></thead>
      <tbody id="riwayat"></tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://inkpmmnuevixoeyfrvqm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlua3BtbW51ZXZpeG9leWZydnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODQ2NjAsImV4cCI6MjEwNDM2MDY2MH0.O9TPF0rlWOQZxSHNJ0w7AqJvoBEFiuz5IeAyjLYAEIw';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const rupiah = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);
const today = () => new Date().toISOString().slice(0, 10);

async function loadData() {
  const { data: anggota, error: errA } = await supabase.from('anggota').select('*').order('id', { ascending: true });
  const { data: setoran, error: errS } = await supabase.from('setoran').select('*').order('created_at', { ascending: false });

  if (errA) console.error("Error Anggota:", errA);
  if (errS) console.error("Error Setoran:", errS);

  const listAnggota = anggota || [];
  const listSetoran = setoran || [];

  const select = document.getElementById('namaSetoran');
  select.innerHTML = '<option value="">Pilih nama</option>' + listAnggota.map(a => `<option value="${esc(a.nama)}">${esc(a.nama)}</option>`).join('');

  const todayDate = today();
  const setoranHariIni = listSetoran.filter(s => s.tanggal === todayDate);
  const sudahSetorSet = new Set(setoranHariIni.map(s => s.nama));

  document.getElementById('totalAnggota').textContent = listAnggota.length;
  document.getElementById('sudahSetor').textContent = sudahSetorSet.size;
  document.getElementById('belumSetor').textContent = Math.max(0, listAnggota.length - sudahSetorSet.size);
  document.getElementById('totalUang').textContent = rupiah(listSetoran.reduce((acc, curr) => acc + Number(curr.jumlah), 0));

  document.getElementById('monitoring').innerHTML = listAnggota.length ? listAnggota.map((a, i) => {
    const s = setoranHariIni.find(x => x.nama === a.nama);
    return `<tr>
      <td>${i + 1}</td>
      <td>${esc(a.nama)}</td>
      <td>${s ? s.tanggal : '—'}</td>
      <td>${s ? rupiah(s.jumlah) : '—'}</td>
      <td class="status ${s ? 'ok' : 'no'}">${s ? 'Sudah setor' : 'Belum setor'}</td>
      <td class="actions">${s ? `<button class="secondary" onclick="hapusSetoran(${s.id})">Hapus</button>` : ''}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" class="empty">Belum ada anggota.</td></tr>';

  document.getElementById('riwayat').innerHTML = listSetoran.length ? listSetoran.map(s => `<tr>
    <td>${esc(s.nama)}</td>
    <td>${s.tanggal}</td>
    <td>${rupiah(s.jumlah)}</td>
    <td class="actions"><button class="secondary" onclick="hapusSetoran(${s.id})">Hapus</button></td>
  </tr>`).join('') : '<tr><td colspan="4" class="empty">Belum ada setoran.</td></tr>';

  document.getElementById('tanggal').value = todayDate;
}

document.getElementById('anggotaForm').onsubmit = async (e) => {
  e.preventDefault();
  const nama = document.getElementById('namaAnggota').value.trim();
  if (nama) {
    const { error } = await supabase.from('anggota').insert([{ nama }]);
    if (error) alert("Gagal tambah anggota: " + error.message);
    document.getElementById('namaAnggota').value = '';
    loadData();
  }
};

document.getElementById('setoranForm').onsubmit = async (e) => {
  e.preventDefault();
  const nama = document.getElementById('namaSetoran').value;
  const tanggal = document.getElementById('tanggal').value;
  const jumlah = Number(document.getElementById('jumlah').value);
  if (nama && tanggal && jumlah >= 0) {
    const { error } = await supabase.from('setoran').insert([{ nama, tanggal, jumlah }]);
    if (error) alert("Gagal simpan setoran: " + error.message);
    document.getElementById('jumlah').value = '';
    loadData();
  }
};

async function hapusSetoran(id) {
  if (confirm('Hapus data setoran ini?')) {
    const { error } = await supabase.from('setoran').delete().eq('id', id);
    if (error) alert("Gagal hapus: " + error.message);
    loadData();
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

loadData();
</script>
</body>
</html>
